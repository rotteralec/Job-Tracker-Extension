<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Tracker settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: 480px; margin: 30px auto; }
  </style>
</head>
<body>
  <h1>Job Tracker settings</h1>

  <label>Apps Script web app URL
    <input type="url" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec">
  </label>

  <label>Secret
    <input type="text" id="secret" placeholder="must match SECRET in Code.gs">
  </label>

  <button id="save">Save settings</button>
  <button id="test" style="margin-top:8px; background:#0F6E56;">Test connection</button>

  <p id="message" class="hidden"></p>

  <script src="options.js"></script>
</body>
</html>
